name: Daily FPL snapshot

on:
  schedule:
    # 03:15 UTC = 04:15 BST / 03:15 GMT, safely after FPL's ~1:30am UK price update.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python scripts/snapshot.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
